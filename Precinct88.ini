; ============================================================================
;  Precinct 88
; ============================================================================
;
;  This file is optional. Every setting below is also the value the mod runs on
;  when the line is missing, so deleting something is safe and deleting the
;  whole file is safe. It is NEVER overwritten by an install -- when a new
;  option ships, the deploy says so and the default applies until you add it.
;
;  Four systems, each switchable on its own. If you only want the beat patrol,
;  turn the other three off and nothing else in here matters.
;
; ============================================================================


[General]

; Off entirely, for somebody who wants it installed and not running.
Enabled=true

; Error, Warn, Info or Debug. Debug is loud and useful exactly once.
Logging=Info

; Opens the settings panel, which also shows what the police currently think --
; the district and its two numbers, how many units are actually on the road, and
; whether anybody has eyes on you or is searching. That readout is the only place
; the mod's premise is visible from inside the game.
;
; F11 was checked rather than picked: free on both installs here. On a Legacy
; install running LSPDFR it is PlateWatch and RealNames, but this mod stands down
; for LSPDFR anyway, so the two cannot both be listening.
MenuKey=F11

; Stand down when LSPDFR is installed here.
;
; LSPDFR owns dispatch and the wanted system and puts you on the other side of
; all of this. Two systems giving officers contradictory orders every frame is
; not a degraded experience, it is one that half works in a way nobody can
; diagnose from inside the game. Set false to run both anyway.
StandDownForLspdfr=true


[Patrol]
; Cars on a beat because the beat exists, not because of you.

Enabled=true

; Cars out at once across the map, BEFORE the district weighting. A ceiling,
; not a target -- Davis at midnight gets all of them and Vinewood Hills at four
; in the morning gets one. Three is a city. Six is an occupation.
Units=3

; Switch off the game's own random police generator.
;
; THIS IS THE SETTING THE MOD IS ABOUT. The vanilla generator is a density
; target, not a spawner: the engine creates squad cars out of view until the
; area's police presence is met, which is why one appears behind you on an
; empty road at three in the morning. Left on, every car this mod drives out of
; a station competes with cars the engine conjures a block away, and the
; density is wrong whatever Units is set to.
;
; True makes this mod the only source of police in the world. False layers it
; over vanilla instead, which is busier and much less coherent.
SuppressVanillaPatrols=true

; Minutes before a unit has finished its round and goes home.
BeatMinutes=11

; Whether units drive out of a real station rather than fading in down the
; street. Skipped automatically when the nearest station is too far to reach
; before you have moved on.
FromStations=true


[Wanted]
; Police who search, rather than police who know.

Enabled=true

; How long they hold your last known position before it goes stale.
;
; This is the number that decides whether a chase is winnable. Too short and
; the police are useless; too long and there was no point breaking line of
; sight in the first place.
LastKnownSeconds=22

; How fast the search area grows around where they last had you, in metres a
; second. Bigger is a force that fans out quickly and is harder to sit still
; inside.
SearchGrowth=5.5

; Widest the search gets before they give up on that area entirely.
SearchMaxRadius=260

; Whether what you look like matters.
;
; On, the radio carries a description -- what you are wearing, what you are
; driving -- and changing either is a real way out. A different jacket does not
; work at four metres with an officer looking straight at you, and it should
; not. Off is vanilla behaviour: they recognise you on sight regardless.
DescriptionMatters=true

; Seconds out of sight AND outside the search area before it is dropped.
LoseThemSeconds=40

; The ceiling. Five is vanilla. Three makes the city feel a great deal smaller,
; because a helicopter is most of what four and five actually mean.
;
; Note that this is a lid on top of the per-crime ceilings, not a replacement
; for them: a traffic stop is two stars however long you run, because that is
; what a traffic stop is worth.
MaxStars=5


[Contact]
; Officers who start something because they have a reason to.

Enabled=true

; A gun in your hand on a street they are on. The one thing that stops a car
; everywhere on the map -- deliberately not a dice roll, because the mod's most
; legible rule should be one you can rely on.
StopForWeapons=true

; Being pulled over for how you are driving, or for what you are driving.
TrafficStops=true

; How far an officer notices something worth stopping you for.
NoticeRange=30

; Seconds between one stop ending and another being possible. ONE CLOCK FOR THE
; WHOLE FORCE, not one per car -- a man walking down a line of squad cars being
; stopped by each of them in turn is a button being spammed.
StopCooldownSeconds=90


[Custody]
; Being caught means custody, rather than a fade to a hospital bill.

Enabled=true

; Whether they cuff you and walk you to the car, or the screen simply goes out.
WalkToTheCar=true

; REAL SECONDS held before release, before the multiplier for what you did.
;
; The one setting anybody argues about, and fairly: it is time not playing. It
; is also the only reason the surrender prompt is a decision rather than a free
; out. Set it to 0 if you disagree -- everything else about custody still
; happens.
HoldSeconds=45

; Whether weapons are taken.
ConfiscateWeapons=true

; Whether contraband is taken.
;
; This is the setting the other mod cares about. Precinct 88 does not know what
; a gram is -- it asks whoever is listening on the bridge what you were
; carrying and tells them it is gone. With nothing installed to listen, this
; only affects weapons and cash.
ConfiscateContraband=true

; The fine, before the multiplier for what they booked you for.
Fine=750

; Hold this to give yourself up when police can see you. A keyboard key name,
; not a controller binding.
SurrenderKey=X
