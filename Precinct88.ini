; ============================================================================
;  Precinct 88
; ============================================================================
;
;  This file is optional. Every setting below is also the value the mod runs on
;  when the line is missing, so deleting something is safe and deleting the
;  whole file is safe. It is NEVER overwritten by an install -- when a new
;  option ships, the deploy says so and the default applies until you add it.
;
;  Four systems, each switchable on its own. If you only want the beat patrol,
;  turn the other three off and nothing else in here matters.
;
; ============================================================================


[General]

; Off entirely, for somebody who wants it installed and not running.
Enabled=true

; Error, Warn, Info or Debug. Debug is loud and useful exactly once.
Logging=Info

; Opens the settings panel, which also shows what the police currently think --
; the district and its two numbers, how many units are actually on the road, and
; whether anybody has eyes on you or is searching. That readout is the only place
; the mod's premise is visible from inside the game.
;
; F11 was checked rather than picked: free on both installs here. On a Legacy
; install running LSPDFR it is PlateWatch and RealNames, but this mod stands down
; for LSPDFR anyway, so the two cannot both be listening.
MenuKey=F11

; Stand down when LSPDFR is installed here.
;
; LSPDFR owns dispatch and the wanted system and puts you on the other side of
; all of this. Two systems giving officers contradictory orders every frame is
; not a degraded experience, it is one that half works in a way nobody can
; diagnose from inside the game. Set false to run both anyway.
StandDownForLspdfr=true


[Patrol]
; Cars on a beat because the beat exists, not because of you.

Enabled=true

; Cars out at once across the map, BEFORE the district weighting. A ceiling,
; not a target -- Davis at midnight gets all of them and Vinewood Hills at four
; in the morning gets one. Three is a city. Six is an occupation.
Units=3

; Switch off the game's own random police generator.
;
; THIS IS THE SETTING THE MOD IS ABOUT. The vanilla generator is a density
; target, not a spawner: the engine creates squad cars out of view until the
; area's police presence is met, which is why one appears behind you on an
; empty road at three in the morning. Left on, every car this mod drives out of
; a station competes with cars the engine conjures a block away, and the
; density is wrong whatever Units is set to.
;
; True makes this mod the only source of police in the world. False layers it
; over vanilla instead, which is busier and much less coherent.
SuppressVanillaPatrols=true

; WHETHER THIS MOD IS THE ONLY THING THAT SENDS POLICE.
;
; SuppressVanillaPatrols above stops the game creating ambient cars for density.
; This stops the other half, which is the half that actually mattered: the
; engine's DISPATCH, which creates squad cars for the purpose the moment you
; have a wanted level and sends them at you from wherever is convenient.
;
; With it on, no police car is ever created because of your stars. Every unit
; that reaches you was already out on a beat and had to drive, and when a
; serious crime happens this mod puts extra cars out itself -- which still have
; to arrive. Sometimes that means a pause before anybody turns up. That is the
; trade, and it is the whole mod.
;
; Off runs the game's dispatch alongside, which floods over everything the beat
; does. Fire and ambulance are never touched either way.
OwnDispatch=true

; Minutes before a unit has finished its round and goes home.
BeatMinutes=11

; Whether units drive out of a real station rather than fading in down the
; street. Skipped automatically when the nearest station is too far to reach
; before you have moved on.
FromStations=true

; How much patrolling goes down the BACKS of things -- service roads, delivery
; bays, the cut-throughs behind a row of shops.
;
; There is no map of alleys anywhere in this mod and there does not need to be.
; The game already marks every node on the road network with whether the satnav
; is allowed to route down it, and the ones it will not route down ARE the back
; ways. So this finds the real alleys, in every district, including ones added
; by map mods, with nothing hand-typed to be wrong about.
;
; Each district has its own figure already -- La Mesa and Davis are mostly back
; lanes, Rockford Hills is driveways and barely any. This is a multiplier over
; all of them at once. 0 keeps every patrol on the main roads.
;
; It is also scaled by the clock: a service road behind a row of shops is
; somewhere a patrol car goes at two in the morning, not two in the afternoon.
; Daytime runs at a quarter of the night figure.
;
; Note that outside the city "not routable" stops meaning alley and starts
; meaning dirt track and fire road. That is still the right behaviour for a
; sheriff, just a different thing to watch.
AlleyPatrol=1.0

; The beam out of the driver's window after dark.
;
; Drawn per frame rather than switched on, because a police car in GTA V has no
; searchlight the engine will turn on for you -- SET_VEHICLE_SEARCHLIGHT is a
; helicopter's and does nothing on a cruiser. It swings rather than snaps, it
; fades up as the night gets darker, and it is off entirely in daylight.
;
; Some crews swing it onto you as they pass and some never do. That is rolled
; once per unit and kept for its whole round, so it is the same two officers
; each time rather than every car in the city behaving identically.
Spotlights=true


[Wanted]
; Police who search, rather than police who know.

Enabled=true

; How long they hold your last known position before it goes stale.
;
; This is the number that decides whether a chase is winnable. Too short and
; the police are useless; too long and there was no point breaking line of
; sight in the first place.
LastKnownSeconds=22

; How fast the search area grows around where they last had you, in metres a
; second. Bigger is a force that fans out quickly and is harder to sit still
; inside.
SearchGrowth=5.5

; Widest the search gets before they give up on that area entirely.
SearchMaxRadius=260

; Whether what you look like matters.
;
; On, the radio carries a description -- what you are wearing, what you are
; driving -- and changing either is a real way out. A different jacket does not
; work at four metres with an officer looking straight at you, and it should
; not. Off is vanilla behaviour: they recognise you on sight regardless.
DescriptionMatters=true

; Seconds out of sight AND outside the search area before it is dropped.
LoseThemSeconds=40

; The ceiling. Five is vanilla. Three makes the city feel a great deal smaller,
; because a helicopter is most of what four and five actually mean.
;
; Note that this is a lid on top of the per-crime ceilings, not a replacement
; for them: a traffic stop is two stars however long you run, because that is
; what a traffic stop is worth.
MaxStars=5

; The strip of tags under the wanted stars saying what the police actually have
; on you -- FACE, FIT, CAR, GUN, CAM.
;
; Red means they hold it AND it still describes you. GREY MEANS THEY HOLD IT AND
; IT IS NOW WRONG, which is the useful half: a grey FIT is them still looking for
; a man in the shirt you changed out of ten minutes ago. NO ID means a crime was
; called in and nobody could describe you at all.
;
; Turning this off changes nothing about how any of it works. You just have to
; work it out from the street.
ShowKnownStrip=true

; How far down the screen the strip sits, under the stars. Nudge if another mod
; has moved your HUD.
KnownStripY=0.083

; CCTV as a witness that is not a person.
;
; The counter to doing everything where nobody is standing. Cameras are found as
; world props rather than from a list of coordinates, so they are wherever the
; game actually put them -- which also means map mods that add a shop add its
; camera for free. If none of the prop names exist in your build, nothing
; happens and the log says so.
CamerasWatch=true

; Whether how VIOLENTLY you work is remembered between incidents.
;
; Not a morality score and it does not care what you do -- only how. Commit a
; crime and drive off and it barely moves. Shoot the clerk and then the first
; officer through the door and it moves a long way, and the response gets colder
; for a while afterwards. It bleeds off in real time on its own, so leaving it
; alone is always the way back. Stored in record.json.
CriminalProfile=true

; Whether a crime scene stays warm after you get away from it.
;
; In vanilla the meter runs out and the street is instantly as innocent as it was
; that morning -- you can drive straight back to the body and park. With this on,
; coming back within a few minutes of something serious can put it back on you,
; once.
SceneStaysWarm=true


[Contact]
; Officers who start something because they have a reason to.

Enabled=true

; A gun in your hand on a street they are on. The one thing that stops a car
; everywhere on the map -- deliberately not a dice roll, because the mod's most
; legible rule should be one you can rely on.
StopForWeapons=true

; Being pulled over for how you are driving, or for what you are driving.
;
; Thirteen things can start a traffic stop: speeding, running a red light,
; driving against traffic, driving on the pavement, hitting a pedestrian, a
; collision, riding without a helmet, a wheelie, drifting, tailgating, an
; unroadworthy vehicle, using a phone at the wheel, and a burnout. You very
; often manage several at once, and the officer leads with the worst.
;
; Four of them are the GAME'S own bookkeeping rather than guesswork on this
; mod's part -- wrong way, pavement, hitting a pedestrian and collisions all
; have natives the engine has been keeping the whole time.
;
; There is no stop sign, and that is deliberate. GTA V has no stop-sign data
; anywhere, so detecting one means guessing which junctions have them, and a
; ticket for running a sign that was never there is worse than no feature.
;
; Running a red light is worked out from the TRAFFIC rather than the light --
; the game will not tell you what colour a light is, but it will tell you which
; cars are stopped at one, and the AI obeys them perfectly. Two cars pointing
; your way sitting at a light means your light is red.
TrafficStops=true

; Which kinds of vehicle the traffic laws apply to at all.
EnforceCars=true
EnforceBikes=true

; Bicycles are off by default. Every rule applies to a pushbike -- you can speed
; on one, ride it on the pavement, go the wrong way -- and being pulled over on
; a BMX is funny exactly once.
EnforceBicycles=false

; The speed and limit readout while driving.
;
; ON BY DEFAULT AS A FAIRNESS SETTING, not an information one. The moment
; speeding became something you get pulled over for, a limit you cannot see
; stopped being a rule and became a trap -- and GTA V has no speed signs to
; read. It appears while you are driving, lingers a moment when you stop, and
; goes red when you are over.
;
; Limits themselves are DERIVED rather than listed. Two questions the game can
; answer decide them: is this the arterial network (the same test that puts
; highway patrol on freeways), and is this a town (the district's own force).
; That gives 120 on open highway, 90 on country roads, 80 on a main road through
; a town, 50 on an ordinary street and 30 down an alley.
;
; scripts\Precinct88\limits.json overrides any of it per zone, and ships nearly
; empty on purpose -- it is for the handful of places the derivation gets wrong.
ShowSpeedLimit=true

; Kilometres, or miles.
SpeedInKph=true

; Where the readout sits, as a fraction of the screen. Nudge if another mod has
; taken the spot.
SpeedHudX=0.5
SpeedHudY=0.895

; How far an officer notices something worth stopping you for.
NoticeRange=30

; Seconds between one stop ending and another being possible. ONE CLOCK FOR THE
; WHOLE FORCE, not one per car -- a man walking down a line of squad cars being
; stopped by each of them in turn is a button being spammed.
StopCooldownSeconds=90


[Custody]
; Being caught means custody, rather than a fade to a hospital bill.

Enabled=true

; Whether they cuff you and walk you to the car, or the screen simply goes out.
WalkToTheCar=true

; REAL SECONDS held before release, before the multiplier for what you did.
;
; The one setting anybody argues about, and fairly: it is time not playing. It
; is also the only reason the surrender prompt is a decision rather than a free
; out. Set it to 0 if you disagree -- everything else about custody still
; happens.
HoldSeconds=45

; Whether weapons are taken.
ConfiscateWeapons=true

; Whether contraband is taken.
;
; This is the setting the other mod cares about. Precinct 88 does not know what
; a gram is -- it asks whoever is listening on the bridge what you were
; carrying and tells them it is gone. With nothing installed to listen, this
; only affects weapons and cash.
ConfiscateContraband=true

; The fine, before the multiplier for what they booked you for.
Fine=750

; Hold this to give yourself up when police can see you. A keyboard key name,
; not a controller binding.
SurrenderKey=X
